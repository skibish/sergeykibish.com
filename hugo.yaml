baseURL: "https://sergeykibish.com"
locale: "en-us"
copyright: "&#169; Sergey Kibish"

enableRobotsTXT: true
enableEmoji: true
disqusShortname: sergey-kibish-blog
taxonomies:
  category: blog/categories
  tag: blog/tags
outputs:
  page: ["HTML"]
  home: ["HTML"]
  section: ["HTML","RSS"]

markup:
  highlight:
    codeFences: true
    guessSyntax: false
    hl_Lines: ""
    lineNoStart: 1
    lineNos: false
    lineNumbersInTable: true
    noClasses: false
    tabWidth: 4

services:
  rss:
    limit: 12

menu:
  main:
  - name: Blog
    pageRef: blog
    weight: -110
  - name: Speaking
    pageRef: speaking
    weight: -100
  - name: Others Say
    pageRef: others-say
    weight: -90
  - name: About
    url: /
    weight: -80
  - name: Music
    pageRef: music
    weight: -70

build:
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: css
    - source: 'tailwind\.config\.js'
      target: css

module:
  mounts:
    - source: assets
      target: assets
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json

security:
  exec:
    allow:
      - '^node$'
      - '^tailwindcss$'
  node:
    permissions:
      allowRead:
        - "*"

params:
  author:
    name: "Sergey Kibish"
    email: "contact@sergeykibish.com"
  images:
    - /img/social-share.png
  description: "Problem solver. Sorting chaos."
